name: NimoPilot source bootstrap and verification

on:
  push:
    branches:
      - production/nimopilot-source-import
    paths:
      - .github/workflows/nimopilot-bootstrap.yml
  workflow_dispatch:

concurrency:
  group: nimopilot-source-bootstrap
  cancel-in-progress: false

jobs:
  import-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out NimoPilot
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: production/nimopilot-source-import
          fetch-depth: 0
      - name: Import pinned upstream source
        env:
          UPSTREAM_COMMIT: 6c4c0802a3967cb25e82f1249fcd68e79614c75f
        run: |
          git clone https://github.com/nanobrowser/nanobrowser.git /tmp/nanobrowser
          git -C /tmp/nanobrowser checkout --detach "$UPSTREAM_COMMIT"
          rsync -a --exclude='.git' --exclude='README.md' --exclude='.github/workflows/file-guard.yml' /tmp/nanobrowser/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import pinned Nanobrowser source foundation"
            git push origin HEAD:production/nimopilot-source-import
          fi

  verify:
    needs: import-source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out NimoPilot
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: production/nimopilot-source-import
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.7 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm type-check
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Build extension
        run: pnpm build
      - name: Package extension
        run: pnpm zip
      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nimopilot-source-build
          path: |
            dist/
            dist-zip/
          if-no-files-found: warn
          retention-days: 14
